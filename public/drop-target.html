<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    /* This page runs in a real system WebView, so prefers-color-scheme here
       reports the macOS appearance — not Photoshop's Interface theme, which is
       what the rest of the panel follows. The theme is pushed in over the
       message bridge instead (see syncDropTheme in src/main.ts) and lands as a
       class on the root element. Dark is the built-in default: it matches
       Photoshop's shipping theme and the panel's own fallback, so the page is
       already right in the common case before the first message arrives. The
       page itself stays opaque so a WebView backing surface recreated during a
       panel reflow cannot expose its white initialization color. */
    :root {
      color-scheme: dark;
      --host-background-color: rgb(50,50,50);
      --drop-surface-color: rgb(8,8,8);
      background-color: var(--host-background-color);
    }
    :root.theme-light { color-scheme: light; --drop-surface-color: rgb(255,255,255); }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden;
                 background-color: var(--host-background-color); }
    body { position: relative; box-sizing: border-box; padding: 2px; font: 11px system-ui, sans-serif; }
    #dropZone {
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      border: 1px dashed rgba(128,128,128,0.65);
      border-radius: 4px;
      /* The label is an instruction, not a result, so it takes the same medium
         gray as the panel's own explanatory lines (.muted in index.html) in each
         theme — it never carries color of its own. */
      color: rgb(128,128,128);
      background-color: var(--drop-surface-color);
      pointer-events: none;
      user-select: none;
    }
    :root.theme-light #dropZone { color: rgb(120,120,120); }
    #dropZone.over {
      border-color: rgba(64,140,240,0.95);
      background: rgba(64,140,240,0.18);
    }
    #dropZone.full { opacity: 0.55; }
    #fileInput {
      position: absolute;
      inset: 2px;
      width: calc(100% - 4px);
      height: calc(100% - 4px);
      margin: 0;
      opacity: 0;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="dropZone" role="region" aria-label="Drop reference images">
    <span id="label">Drop PNG, JPEG or WebP here</span>
  </div>
  <input
    id="fileInput"
    type="file"
    accept="image/png,image/jpeg,image/webp,.png,.jpg,.jpeg,.webp"
    multiple
    aria-label="Choose or drop reference images"
  />
  <script src="./drop-target.js"></script>
</body>
</html>
