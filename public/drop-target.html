<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    /* This page runs in a real system WebView, so prefers-color-scheme here
       reports the macOS appearance — not Photoshop's Interface theme, which is
       what the rest of the panel follows. The theme is pushed in over the
       message bridge instead (see syncDropTheme in src/main.ts) and lands as a
       class on the root element. Dark is the built-in default: it matches
       Photoshop's shipping theme and the panel's own fallback, so the page is
       already right in the common case before the first message arrives. */
    :root { color-scheme: dark; }
    :root.theme-light { color-scheme: light; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    body { position: relative; box-sizing: border-box; padding: 2px; font: 11px system-ui, sans-serif; }
    #dropZone {
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      border: 1px dashed rgba(128,128,128,0.65);
      border-radius: 4px;
      /* Off-white on the dark themes, dark gray on the light ones — the label
         never carries colour of its own, only the panel's own contrast. */
      color: rgba(235,235,235,0.85);
      background: rgba(128,128,128,0.08);
      pointer-events: none;
      user-select: none;
    }
    :root.theme-light #dropZone { color: rgba(64,64,64,0.85); }
    #dropZone.over {
      border-color: rgba(64,140,240,0.95);
      background: rgba(64,140,240,0.18);
    }
    #dropZone.full { opacity: 0.55; }
    #fileInput {
      position: absolute;
      inset: 2px;
      width: calc(100% - 4px);
      height: calc(100% - 4px);
      margin: 0;
      opacity: 0;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="dropZone" role="region" aria-label="Drop reference images">
    <span id="label">Drop PNG, JPEG or WebP here</span>
  </div>
  <input
    id="fileInput"
    type="file"
    accept="image/png,image/jpeg,image/webp,.png,.jpg,.jpeg,.webp"
    multiple
    aria-label="Choose or drop reference images"
  />
  <script src="./drop-target.js"></script>
</body>
</html>
